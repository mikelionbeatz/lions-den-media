<html lang="en">
<head>

:root {
  --bg: #0d0f12;
  --card: #161a20;
  --accent: #2de2e6;
  --text: #e0e6ed;
  --muted: #8b9bb4;
  --border: #232936;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background-color: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  padding-bottom: 95px;
}
header {
  padding: 24px 16px;
  text-align: center;
  border-bottom: 1px solid var(--border);
}
header h1 { font-size: 1.6rem; letter-spacing: 2px; color: var(--accent); }
header p { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }

/* Sticky YouTube-Style Tab Navigation */
nav {
  display: flex;
  justify-content: center;
  gap: 10px;
  padding: 14px 16px;
  background: #111419;
  position: sticky;
  top: 0;
  z-index: 20;
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
}
nav button {
  background: none;
  border: 1px solid #2a3242;
  color: var(--text);
  padding: 8px 18px;
  cursor: pointer;
  border-radius: 4px;
  font-size: 0.9rem;
  font-weight: 500;
  white-space: nowrap;
  transition: all 0.2s ease;
}
nav button.active, nav button:hover {
  background: var(--accent);
  color: #000;
  border-color: var(--accent);
  font-weight: bold;
}

/* Page Layout & General Cards */
main { max-width: 1100px; margin: 24px auto; padding: 0 16px; }
.tab-content { display: none; }
.tab-content.active { display: block; }

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 20px;
  margin-bottom: 16px;
}
.card h2 { color: var(--accent); margin-bottom: 8px; font-size: 1.25rem; }
.card p { color: var(--muted); line-height: 1.5; font-size: 0.95rem; margin-bottom: 12px; }

.btn-primary {
  background: var(--accent);
  border: none;
  padding: 8px 18px;
  cursor: pointer;
  font-weight: bold;
  border-radius: 4px;
  color: #000;
  text-decoration: none;
  display: inline-block;
  font-size: 0.9rem;
}
.btn-primary:hover { opacity: 0.9; }

/* Home Page 2-Column Row Layout (YouTube Featured Trailer Sizing) */
.home-featured-grid {
  display: grid;
  grid-template-columns: minmax(360px, 460px) 1fr;
  gap: 20px;
  align-items: stretch;
  margin-bottom: 20px;
}

@media (max-width: 820px) {
  .home-featured-grid {
    grid-template-columns: 1fr;
  }
}

/* Video Tab Grid & Responsive 16:9 Embeds */
.video-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 20px;
  margin-top: 20px;
}
.video-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 6px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.video-responsive {
  position: relative;
  width: 100%;
  padding-top: 56.25%; /* 16:9 ratio */
}
.video-responsive iframe {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  border: 0;
}
.video-card-footer {
  padding: 12px 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #111419;
}
.video-card-footer a {
  color: var(--accent);
  font-size: 0.85rem;
  text-decoration: none;
  font-weight: 500;
}
.video-card-footer a:hover { text-decoration: underline; }
